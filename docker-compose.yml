x-app: &app
  # 四个服务共用同一个镜像，避免 migrate 用旧镜像导致迁移不生效
  image: wxarticleget-app:latest
  build:
    context: .
  env_file:
    - .env
  restart: unless-stopped
  environment: &appEnv
    # 容器内通过服务名访问 MySQL；宿主上的 .env 里是 localhost，这里必须覆盖
    DATABASE_URL: mysql://${MYSQL_USER:-wx}:${MYSQL_PASSWORD:-wx}@mysql:3306/${MYSQL_DATABASE:-wx_article}
    # 生产镜像 + next start 需要 production，避免 Next.js 非标准 NODE_ENV 警告
    NODE_ENV: production

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Prisma 读写 MySQL 的 DATETIME 时一律按 UTC 处理，数据库也必须是 UTC，
    # 否则 DEFAULT CURRENT_TIMESTAMP 会写成东八区时间，和 Prisma 写入的时间差 8 小时。
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wx-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wx_article}
      MYSQL_USER: ${MYSQL_USER:-wx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wx}
      TZ: UTC
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrate:
    <<: *app
    restart: 'no'
    command: ['pnpm', '--filter', '@wx/db', 'migrate']
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: *app
    command: ['pnpm', '--filter', '@wx/api', 'start']
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *appEnv
      PORT: 3001
      DATA_DIR: /data
    volumes:
      - appdata:/data
    ports:
      - '3001:3001'

  worker:
    <<: *app
    command: ['pnpm', '--filter', '@wx/worker', 'start']
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *appEnv
      DATA_DIR: /data
    volumes:
      - appdata:/data

  web:
    <<: *app
    command: ['pnpm', '--filter', '@wx/web', 'start']
    environment:
      API_INTERNAL_URL: http://api:3001
    ports:
      - '3000:3000'

volumes:
  mysqldata:
  appdata:
