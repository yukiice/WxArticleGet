services:
  app:
    image: wxarticleget-app:latest
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PRISMA_ENGINES_MIRROR: ${PRISMA_ENGINES_MIRROR:-https://cdn.npmmirror.com/binaries/prisma}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
    # DATABASE_URL 原样读取 .env；此域名可访问宿主机已映射的数据库端口。
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - appdata:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  appdata:
