x-app: &app
  # 四个服务共用同一个镜像，避免 migrate 用旧镜像导致迁移不生效
  image: wxarticleget-app:latest
  build:
    context: .
  env_file:
    - .env
  restart: unless-stopped
  environment: &appEnv
    # 容器内通过服务名访问 Postgres；宿主上的 .env 里是 localhost，这里必须覆盖
    DATABASE_URL: postgresql://${POSTGRES_USER:-wx}:${POSTGRES_PASSWORD:-wx}@postgres:5432/${POSTGRES_DB:-wx_article}?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wx}
      POSTGRES_DB: ${POSTGRES_DB:-wx_article}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-wx} -d ${POSTGRES_DB:-wx_article}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    restart: 'no'
    command: ['pnpm', '--filter', '@wx/db', 'migrate']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ['pnpm', '--filter', '@wx/api', 'start']
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *appEnv
      PORT: 3001
      DATA_DIR: /data
    volumes:
      - appdata:/data
    ports:
      - '3001:3001'

  worker:
    <<: *app
    command: ['pnpm', '--filter', '@wx/worker', 'start']
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *appEnv
      DATA_DIR: /data
    volumes:
      - appdata:/data

  web:
    <<: *app
    command: ['pnpm', '--filter', '@wx/web', 'start']
    environment:
      API_INTERNAL_URL: http://api:3001
    ports:
      - '3000:3000'

volumes:
  pgdata:
  appdata:
